<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porpoise 대시보드</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🐬 Porpoise <span class="muted">대시보드</span></h1>
    <div class="controls">
      <span id="project-wrap" class="hidden">
        <label for="project">프로젝트</label>
        <select id="project"></select>
      </span>
      <label for="milestone">마일스톤</label>
      <select id="milestone"></select>
      <button id="refresh" title="새로고침">↻</button>
    </div>
  </header>

  <main>
    <section class="panel" id="live-panel">
      <h2>라이브 <span id="live-badge" class="live-badge idle">IDLE</span>
        <button id="launch-fleet" class="btn-launch hidden" title="대시보드에서 conductor 런을 기동합니다">▶ 함대 실행</button>
        <button id="force-launch" class="btn-launch hidden" title="남아있는 런 락을 무시하고 강제 기동 (실행 중이 아닐 때만)">강제 실행</button>
        <button id="stop-next" class="btn-stop hidden" title="진행 중인 task를 마친 뒤 다음 게이트에서 정지">다음 게이트에서 정지</button>
        <span id="launch-msg" class="launch-msg hidden"></span>
      </h2>
      <div id="gate-card" class="gate-card hidden">
        <div id="gate-prompt" class="gate-prompt"></div>
        <input id="gate-text" class="gate-text hidden" type="text" placeholder="입력 (비워두면 건너뜀)" />
        <div class="gate-actions">
          <button id="gate-approve" class="btn-approve">승인</button>
          <button id="gate-stop" class="btn-stop">정지</button>
          <span id="gate-error" class="gate-error hidden"></span>
        </div>
      </div>
      <div id="live-body" class="muted">실행 중인 함대 없음</div>
      <div id="live-budget" class="hidden">
        <div class="budget-bar"><div id="budget-fill"></div></div>
        <div id="budget-label" class="muted"></div>
      </div>
    </section>

    <section id="rollup" class="cards"></section>

    <section class="panel">
      <h2>비용 (태스크별, USD)</h2>
      <div id="cost-chart" class="chart"></div>
    </section>

    <section class="panel">
      <h2>실행 리포트</h2>
      <table id="report-table">
        <thead>
          <tr><th>Task</th><th>Verdict</th><th>시도</th><th>재투입</th><th>폴백</th><th>비용</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="report-empty" class="muted hidden">집계할 감사 기록이 없습니다.</p>
    </section>

    <section class="panel" id="config-panel">
      <h2>설정 <span class="muted">([conductor])</span>
        <button id="config-toggle" class="btn-cfg" title="설정 편집 폼 열기/닫기">편집</button>
      </h2>
      <form id="config-form" class="config-form hidden">
        <label>mode
          <select name="mode"><option value="conductor">conductor</option><option value="legacy">legacy</option></select>
        </label>
        <label>approval_mode
          <select name="approval_mode"><option value="console">console</option><option value="gate">gate</option></select>
        </label>
        <label>verdict_fallback
          <select name="verdict_fallback"><option value="pass_if_checks_pass">pass_if_checks_pass</option><option value="halt">halt</option></select>
        </label>
        <label>max_parallel
          <input type="number" name="max_parallel" min="1" max="8" step="1" />
        </label>
        <label>max_redispatch
          <input type="number" name="max_redispatch" min="0" max="20" step="1" />
        </label>
        <label>dashboard_port
          <input type="number" name="dashboard_port" min="1024" max="65535" step="1" />
        </label>
        <label class="cb">serve_dashboard
          <input type="checkbox" name="serve_dashboard" />
        </label>
        <label class="cb">park_on_halt
          <input type="checkbox" name="park_on_halt" />
        </label>
        <label class="cb">auto_replan
          <input type="checkbox" name="auto_replan" />
        </label>
        <label>verifier_model
          <input type="text" name="verifier_model" maxlength="200" placeholder="(비워두면 dispatch와 동일)" />
        </label>
        <div class="config-actions">
          <button type="submit" class="btn-approve">저장</button>
          <span id="config-msg" class="launch-msg hidden"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>의존성 그래프</h2>
      <div class="legend">
        <span class="dot done"></span> 완료
        <span class="dot ready"></span> 실행 가능
        <span class="dot waiting"></span> 대기(deps)
      </div>
      <div id="dep-graph" class="chart"></div>
    </section>
  </main>

  <footer class="muted">read-only 관측 · Porpoise dashboard</footer>

  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
